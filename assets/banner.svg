<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Shrook Kassem — AI Engineer, model and data optimization">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0C1626"/>
      <stop offset="55%" stop-color="#111F35"/>
      <stop offset="100%" stop-color="#0C1626"/>
    </linearGradient>

    <radialGradient id="glow" cx="76%" cy="14%" r="62%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity=".30"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="under" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ADEC0" stop-opacity=".17"/>
      <stop offset="100%" stop-color="#4ADEC0" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#4ADEC0"/>
    </linearGradient>

    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="frame"><rect width="1200" height="340" rx="10"/></clipPath>

    <path id="loss" d="M0,66 C120,96 190,176 300,222 C410,268 470,236 560,272 C650,308 700,338 800,356 C900,374 980,384 1080,391 C1140,395 1175,397 1200,398"/>
  </defs>

  <style>
    .draw{
      stroke-dasharray:1600;
      stroke-dashoffset:1600;
      animation:draw 2.4s cubic-bezier(.33,.9,.36,1) .25s forwards;
    }
    .draw-ghost{
      stroke-dasharray:1600;
      stroke-dashoffset:1600;
      animation:draw 2.4s cubic-bezier(.33,.9,.36,1) 0s forwards;
    }
    .ghost{opacity:0;animation:ghostIn 1.2s ease .9s forwards}
    @keyframes ghostIn{to{opacity:.16}}
    .fade{opacity:0;animation:fade .9s ease 1.8s forwards}
    .fade-2{opacity:0;animation:fade .9s ease 2.05s forwards}
    .fade-3{opacity:0;animation:fade .9s ease 2.3s forwards}
    .fade-4{opacity:0;animation:fade .9s ease 2.55s forwards}
    .wipe{transform:scaleX(0);transform-origin:0 50%;animation:wipe .9s cubic-bezier(.33,.9,.36,1) 2.2s forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    @keyframes fade{to{opacity:1}}
    @keyframes wipe{to{transform:scaleX(1)}}
    @media (prefers-reduced-motion:reduce){
      .draw{stroke-dashoffset:0;animation:none}
      .ghost{opacity:.16;animation:none}
      .fade,.fade-2,.fade-3,.fade-4{opacity:1;animation:none}
      .wipe{transform:scaleX(1);animation:none}
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#sky)"/>
    <rect width="1200" height="340" fill="url(#glow)"/>

    <!-- measurement grid -->
    <g stroke="#FFFFFF" stroke-opacity=".05" stroke-width="1">
      <line x1="0" y1="85" x2="1200" y2="85"/>
      <line x1="0" y1="170" x2="1200" y2="170"/>
      <line x1="0" y1="255" x2="1200" y2="255"/>
      <line x1="200" y1="0" x2="200" y2="340"/>
      <line x1="400" y1="0" x2="400" y2="340"/>
      <line x1="600" y1="0" x2="600" y2="340"/>
      <line x1="800" y1="0" x2="800" y2="340"/>
      <line x1="1000" y1="0" x2="1000" y2="340"/>
    </g>

    <!-- convergence curves -->
    <g transform="translate(0,-46)">
      <use href="#loss" class="ghost" fill="none" stroke="#FFFFFF"
           stroke-width="1.5" stroke-dasharray="5 7" transform="translate(0,44)"/>
      <use href="#loss" class="draw" fill="none" stroke="#4ADEC0" stroke-width="2.4"
           stroke-linecap="round" filter="url(#soft)"/>
      <circle r="4.5" fill="#4ADEC0" filter="url(#soft)" opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="2.5s" dur=".4s" fill="freeze"/>
        <animateMotion dur="7s" begin="2.5s" repeatCount="indefinite" keyPoints="0;1"
                       keyTimes="0;1" calcMode="linear">
          <mpath href="#loss"/>
        </animateMotion>
      </circle>
    </g>

    <!-- content -->
    <g transform="translate(64,0)">
      <text class="fade" x="0" y="98" fill="#7D93AE"
            font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace"
            font-size="13" letter-spacing="3.4">CAIRO, EGYPT</text>

      <text class="fade-2" x="0" y="164" fill="#FFFFFF"
            font-family="'Segoe UI',Helvetica,Arial,sans-serif"
            font-size="58" font-weight="800" letter-spacing="-1.6">Shrook Kassem</text>

      <rect class="wipe" x="0" y="186" width="132" height="3" rx="1.5" fill="url(#rule)"/>

      <text class="fade-3" x="0" y="222" fill="#4ADEC0"
            font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace"
            font-size="17">AI Engineer — model &amp; data optimization</text>

      <text class="fade-4" x="0" y="264" fill="#B9C9DC"
            font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16.5">
        Better models without spending more compute to get there.
      </text>

      <!-- readout -->
      <g class="fade-4" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace">
        <g transform="translate(0,300)">
          <text x="0" y="0" fill="#4ADEC0" font-size="19" font-weight="600">4→2</text>
          <text x="52" y="0" fill="#6F86A2" font-size="11.5" letter-spacing="1.4">GPUS</text>
        </g>
        <g transform="translate(130,300)">
          <text x="0" y="0" fill="#4ADEC0" font-size="19" font-weight="600">87%</text>
          <text x="52" y="0" fill="#6F86A2" font-size="11.5" letter-spacing="1.4">DICE</text>
        </g>
        <g transform="translate(258,300)">
          <text x="0" y="0" fill="#4ADEC0" font-size="19" font-weight="600">92.1%</text>
          <text x="72" y="0" fill="#6F86A2" font-size="11.5" letter-spacing="1.4">ALLOCATION</text>
        </g>
        <g transform="translate(440,300)">
          <text x="0" y="0" fill="#4ADEC0" font-size="19" font-weight="600">2</text>
          <text x="22" y="0" fill="#6F86A2" font-size="11.5" letter-spacing="1.4">PAPERS UNDER REVIEW</text>
        </g>
      </g>
    </g>

    <rect width="1200" height="340" rx="10" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>
  </g>
</svg>
